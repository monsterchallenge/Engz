<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة Engz</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --soft: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .wrapper {
      max-width: 820px;
      margin: 16px auto;
      background: var(--card);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      color: var(--primary);
    }

    .sub {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .lock-box {
      max-width: 400px;
      margin: 30px auto;
      background: var(--soft);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    @media (min-width: 600px) {
      .stats {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .stat-card {
      background: var(--soft);
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .stat-num {
      font-size: 22px;
      font-weight: bold;
      color: var(--primary);
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--soft);
      color: var(--text);
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .item-card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      background: var(--soft);
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .badge {
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      background: #ccfbf1;
      color: var(--primary-dark);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    input, select, button {
      font-family: inherit;
      font-size: 14px;
      border-radius: 9px;
    }

    input[type="password"], input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }

    select {
      padding: 7px 10px;
      border: 1px solid var(--border);
      background: #fff;
    }

    button {
      padding: 8px 14px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      width: 100%;
    }

    .btn-save {
      background: var(--primary);
      color: #fff;
    }

    .btn-del {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .notice {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #e2e8f0;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div>
        <h1 id="admin-title">لوحة تحكم Engz</h1>
        <p class="sub">متابعة الطلبات والمهام والنقاط وتحديث الحالات</p>
      </div>
      <a href="index.html" style="font-size:13px; color:#0f766e; font-weight:bold; text-decoration:none;">العودة للتطبيق</a>
    </div>

    <!-- شاشة الدخول بالرمز السري -->
    <div id="lock-screen" class="lock-box">
      <label for="pin-input" style="display:block; font-weight:bold; margin-bottom:6px;">أدخل كلمة سر الإدارة للدخول</label>
      <input type="password" id="pin-input" placeholder="أدخل كلمة السر..." />
      <button class="btn-primary" onclick="unlockAdmin()">دخول لوحة الإدارة</button>
      <div id="lock-msg" class="notice" style="display:none;"></div>
    </div>

    <!-- محتوى لوحة الإدارة بعد الدخول -->
    <div id="admin-panel" style="display:none;">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-num" id="stat-orders">0</div>
          <div class="stat-label">إجمالي الطلبات</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-new-orders">0</div>
          <div class="stat-label">طلبات جديدة</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-tasks">0</div>
          <div class="stat-label">المهام المسجلة</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-points">0</div>
          <div class="stat-label">إجمالي النقاط</div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-sec="orders" onclick="switchSection('orders')">إدارة الطلبات</button>
        <button class="tab-btn" data-sec="tasks" onclick="switchSection('tasks')">إدارة المهام والنقاط</button>
      </div>

      <div id="sec-orders" class="section active">
        <div id="orders-list"></div>
      </div>

      <div id="sec-tasks" class="section">
        <div id="tasks-list"></div>
      </div>

      <div id="admin-notice" class="notice">جاهز لمتابعة البيانات لحظياً.</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase,
      ref,
      onValue,
      update,
      remove
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // إعدادات الإدارة
    const ADMIN_CONFIG = {
      appName: "Engz",
      pin: "38512385",
      databaseURL: "https://engz-2567e-default-rtdb.firebaseio.com"
    };

    document.title = "إدارة " + ADMIN_CONFIG.appName;
    document.getElementById("admin-title").textContent = "لوحة تحكم " + ADMIN_CONFIG.appName;

    const app = initializeApp({ databaseURL: ADMIN_CONFIG.databaseURL });
    const db = getDatabase(app);

    window.unlockAdmin = function () {
      const entered = document.getElementById("pin-input").value.trim();
      const lockMsg = document.getElementById("lock-msg");

      if (entered === ADMIN_CONFIG.pin) {
        document.getElementById("lock-screen").style.display = "none";
        document.getElementById("admin-panel").style.display = "block";
        startListeners();
      } else {
        lockMsg.style.display = "block";
        lockMsg.textContent = "كلمة السر غير صحيحة، حاول مرة أخرى.";
      }
    };

    window.switchSection = function (sec) {
      document.querySelectorAll(".tab-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.sec === sec);
      });
      document.querySelectorAll(".section").forEach((s) => {
        s.classList.remove("active");
      });
      document.getElementById("sec-" + sec).classList.add("active");
    };

    function notify(msg) {
      const el = document.getElementById("admin-notice");
      if (el) el.textContent = msg;
    }

    function esc(v) {
      return String(v ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    let ordersArr = [];
    let tasksArr = [];

    function updateStats() {
      document.getElementById("stat-orders").textContent = String(ordersArr.length);
      const newCount = ordersArr.filter((o) => (o.status || "جديد") === "جديد").length;
      document.getElementById("stat-new-orders").textContent = String(newCount);
      document.getElementById("stat-tasks").textContent = String(tasksArr.length);
      const totalPts = tasksArr.reduce((sum, t) => sum + (Number(t.points) || 0), 0);
      document.getElementById("stat-points").textContent = String(totalPts);
    }

    function renderOrders() {
      const container = document.getElementById("orders-list");
      if (!ordersArr.length) {
        container.innerHTML = '<div class="empty">لا توجد طلبات مسجلة حالياً.</div>';
        return;
      }

      container.innerHTML = ordersArr
        .map((o) => {
          const st = o.status || "جديد";
          return `
            <div class="item-card">
              <div class="item-top">
                <strong>${esc(o.customer)}</strong>
                <span class="badge">${esc(o.category || "طلب")} — ${esc(st)}</span>
              </div>
              <div>${esc(o.details)}</div>
              <div class="actions">
                <select id="status-${esc(o.id)}">
                  <option value="جديد" ${st === "جديد" ? "selected" : ""}>جديد</option>
                  <option value="جاري التنفيذ" ${st === "جاري التنفيذ" ? "selected" : ""}>جاري التنفيذ</option>
                  <option value="مكتمل" ${st === "مكتمل" ? "selected" : ""}>مكتمل</option>
                </select>
                <button class="btn-save" onclick="updateOrderStatus('${esc(o.id)}')">تحديث الحالة</button>
                <button class="btn-del" onclick="deleteRecord('orders', '${esc(o.id)}')">حذف الطلب</button>
              </div>
            </div>
          `;
        })
        .join("");
    }

    function renderTasks() {
      const container = document.getElementById("tasks-list");
      if (!tasksArr.length) {
        container.innerHTML = '<div class="empty">لا توجد مهام مسجلة حالياً.</div>';
        return;
      }

      container.innerHTML = tasksArr
        .map((t) => {
          const pts = Number(t.points) || 0;
          return `
            <div class="item-card">
              <div class="item-top">
                <strong>${esc(t.user)}</strong>
                <span class="badge">${esc(t.taskTitle || "مهمة")} (${pts} نقطة)</span>
              </div>
              <div>الإثبات: ${esc(t.proof)}</div>
              <div class="actions">
                <input type="number" id="pts-${esc(t.id)}" value="${pts}" style="width:110px; margin:0;" />
                <button class="btn-save" onclick="updateTaskPoints('${esc(t.id)}')">حفظ النقاط</button>
                <button class="btn-del" onclick="deleteRecord('tasks', '${esc(t.id)}')">حذف المهمة</button>
              </div>
            </div>
          `;
        })
        .join("");
    }

    window.updateOrderStatus = async function (id) {
      const selectEl = document.getElementById("status-" + id);
      if (!selectEl) return;
      try {
        await update(ref(db, `orders/${id}`), { status: selectEl.value });
        notify("تم تحديث حالة الطلب بنجاح.");
      } catch (err) {
        notify("تعذر تحديث الحالة: " + err.message);
      }
    };

    window.updateTaskPoints = async function (id) {
      const inputEl = document.getElementById("pts-" + id);
      if (!inputEl) return;
      const newPts = Number(inputEl.value) || 0;
      try {
        await update(ref(db, `tasks/${id}`), { points: newPts });
        notify("تم تحديث نقاط المهمة بنجاح.");
      } catch (err) {
        notify("تعذر تحديث النقاط: " + err.message);
      }
    };

    window.deleteRecord = async function (node, id) {
      try {
        await remove(ref(db, `${node}/${id}`));
        notify("تم حذف السجل بنجاح.");
      } catch (err) {
        notify("تعذر الحذف: " + err.message);
      }
    };

    function startListeners() {
      onValue(ref(db, "orders"), (snap) => {
        const data = snap.val() || {};
        ordersArr = Object.entries(data)
          .map(([id, val]) => ({ id, ...val }))
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        renderOrders();
        updateStats();
      });

      onValue(ref(db, "tasks"), (snap) => {
        const data = snap.val() || {};
        tasksArr = Object.entries(data)
          .map(([id, val]) => ({ id, ...val }))
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        renderTasks();
        updateStats();
      });
    }
  </script>
</body>
</html>
