<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engz</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --success-bg: #ecfdf5;
      --success-text: #065f46;
      --warn-bg: #fffbeb;
      --warn-text: #92400e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .app-wrapper {
      max-width: 680px;
      margin: 16px auto;
      background: var(--card);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 18px;
    }

    .brand-title {
      margin: 0;
      font-size: 26px;
      color: var(--primary);
      font-weight: bold;
    }

    .brand-sub {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .points-badge {
      background: #f0fdfa;
      border: 1px solid #99f6e4;
      color: var(--primary-dark);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .tab-btn {
      padding: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
      color: #1e293b;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      background: #ffffff;
      color: var(--text);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    @media (min-width: 520px) {
      .btn-row.two-cols {
        grid-template-columns: 1fr 1fr;
      }
    }

    .btn-primary, .btn-secondary {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    .alert {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid #fde68a;
    }

    .alert.ok {
      background: var(--success-bg);
      color: var(--success-text);
      border-color: #a7f3d0;
    }

    .feed-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .feed-item {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      background: #f8fafc;
    }

    .feed-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .tag {
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      background: #ccfbf1;
      color: #0f766e;
    }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <div class="top-bar">
      <div>
        <h1 class="brand-title" id="app-heading">Engz</h1>
        <p class="brand-sub">إدارة الطلبات والمهام والنقاط لحظياً</p>
      </div>
      <div class="points-badge">
        إجمالي النقاط: <span id="total-points">0</span> نقطة
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="orders" onclick="switchTab('orders')">الطلبات</button>
      <button class="tab-btn" data-tab="tasks" onclick="switchTab('tasks')">المهام والنقاط</button>
      <button class="tab-btn" data-tab="feed" onclick="switchTab('feed')">السجل المباشر</button>
    </div>

    <!-- تبويب الطلبات -->
    <div id="panel-orders" class="panel active">
      <div class="form-group">
        <label for="order-customer">الاسم أو رقم الهاتف</label>
        <input type="text" id="order-customer" placeholder="مثال: محمود - 010xxxxxxxx" />
      </div>

      <div class="form-group">
        <label for="order-category">نوع الطلب</label>
        <select id="order-category">
          <option value="توصيل طلبات">توصيل طلبات</option>
          <option value="مطعم وعروض">مطعم وعروض</option>
          <option value="مشوار / خدمة">مشوار / خدمة</option>
          <option value="استفسار أو حجز">استفسار أو حجز</option>
        </select>
      </div>

      <div class="form-group">
        <label for="order-details">تفاصيل الطلب والعنوان</label>
        <textarea id="order-details" placeholder="اكتب تفاصيل الطلب ومكان التوصيل بدقة..."></textarea>
      </div>

      <div class="btn-row two-cols">
        <button class="btn-primary" id="save-order-btn" onclick="saveOrder(false)">حفظ الطلب في النظام</button>
        <button class="btn-secondary" onclick="saveOrder(true)">حفظ وإرسال عبر واتساب</button>
      </div>
    </div>

    <!-- تبويب المهام والنقاط -->
    <div id="panel-tasks" class="panel">
      <div class="form-group">
        <label for="task-user">اسم العضو أو رقم التواصل</label>
        <input type="text" id="task-user" placeholder="اكتب اسمك أو رقمك..." />
      </div>

      <div class="form-group">
        <label for="task-type">اختر المهمة المنجزة</label>
        <select id="task-type">
          <option value="مشاركة عرض أو منشور|10">مشاركة عرض أو منشور (+10 نقاط)</option>
          <option value="إحالة عميل أو طلب جديد|25">إحالة عميل أو طلب جديد (+25 نقطة)</option>
          <option value="تقييم أو ملاحظات خدمة|15">تقييم أو ملاحظات خدمة (+15 نقطة)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="task-proof">رابط أو وصف الإثبات</label>
        <input type="text" id="task-proof" placeholder="مثال: تمت المشاركة في مجموعة كذا..." />
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="save-task-btn" onclick="saveTask()">تسجيل المهمة وإضافة النقاط</button>
      </div>
    </div>

    <!-- تبويب السجل المباشر -->
    <div id="panel-feed" class="panel">
      <div class="feed-list" id="activity-feed">
        <div class="empty-msg">جاري تحميل السجل من قاعدة البيانات...</div>
      </div>
    </div>

    <div id="status-message" class="alert">جاري الاتصال بقاعدة بيانات Firebase...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase,
      ref,
      push,
      onValue,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // إعدادات التطبيق الرئيسية (عدّلها في أي وقت)
    const APP_CONFIG = {
      appName: "Engz",
      whatsappNumber: "", // مثال: "2010xxxxxxxx" (بدون علامة +)
      databaseURL: "https://engz-2567e-default-rtdb.firebaseio.com"
    };

    document.title = APP_CONFIG.appName;
    document.getElementById("app-heading").textContent = APP_CONFIG.appName;

    const app = initializeApp({ databaseURL: APP_CONFIG.databaseURL });
    const db = getDatabase(app);

    const statusEl = document.getElementById("status-message");
    const feedEl = document.getElementById("activity-feed");
    const pointsEl = document.getElementById("total-points");

    function setStatus(msg, isOk = false) {
      statusEl.textContent = msg;
      statusEl.className = isOk ? "alert ok" : "alert";
    }

    window.switchTab = function (tabName) {
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === tabName);
      });
      document.querySelectorAll(".panel").forEach((panel) => {
        panel.classList.remove("active");
      });
      document.getElementById("panel-" + tabName).classList.add("active");
    };

    window.saveOrder = async function (openWhatsApp) {
      const customer = document.getElementById("order-customer").value.trim();
      const category = document.getElementById("order-category").value;
      const details = document.getElementById("order-details").value.trim();
      const btn = document.getElementById("save-order-btn");

      if (!customer || !details) {
        setStatus("من فضلك أدخل الاسم أو رقم الهاتف وتفاصيل الطلب أولاً.");
        return;
      }

      btn.disabled = true;
      setStatus("جاري حفظ الطلب في قاعدة البيانات...");

      const payload = {
        kind: "order",
        appName: APP_CONFIG.appName,
        customer,
        category,
        details,
        status: "جديد",
        createdAt: serverTimestamp()
      };

      try {
        await push(ref(db, "orders"), payload);
        setStatus("تم حفظ الطلب بنجاح في قاعدة البيانات.", true);

        if (openWhatsApp) {
          const text = encodeURIComponent(
            `*طلب جديد عبر ${APP_CONFIG.appName}*\n` +
            `العميل: ${customer}\n` +
            `النوع: ${category}\n` +
            `التفاصيل: ${details}`
          );
          const url = APP_CONFIG.whatsappNumber
            ? `https://wa.me/${APP_CONFIG.whatsappNumber}?text=${text}`
            : `https://wa.me/?text=${text}`;
          window.open(url, "_blank");
        }

        document.getElementById("order-details").value = "";
      } catch (err) {
        setStatus("تعذر حفظ الطلب: " + err.message);
      } finally {
        btn.disabled = false;
      }
    };

    window.saveTask = async function () {
      const user = document.getElementById("task-user").value.trim();
      const rawTask = document.getElementById("task-type").value;
      const proof = document.getElementById("task-proof").value.trim();
      const btn = document.getElementById("save-task-btn");

      if (!user || !proof) {
        setStatus("من فضلك أدخل اسم العضو ووصف أو رابط الإثبات.");
        return;
      }

      const [taskTitle, pointsStr] = rawTask.split("|");
      const points = Number(pointsStr) || 0;

      btn.disabled = true;
      setStatus("جاري تسجيل المهمة وحساب النقاط...");

      try {
        await push(ref(db, "tasks"), {
          kind: "task",
          appName: APP_CONFIG.appName,
          user,
          taskTitle,
          points,
          proof,
          createdAt: serverTimestamp()
        });

        document.getElementById("task-proof").value = "";
        setStatus(`تم تسجيل المهمة وإضافة ${points} نقطة بنجاح.`, true);
      } catch (err) {
        setStatus("تعذر تسجيل المهمة: " + err.message);
      } finally {
        btn.disabled = false;
      }
    };

    let latestOrders = [];
    let latestTasks = [];

    function renderFeed() {
      let totalPoints = 0;
      const combined = [];

      latestOrders.forEach((item) => {
        combined.push({
          sortTime: item.createdAt || 0,
          badge: item.category || "طلب",
          title: item.customer || "مستخدم",
          body: item.details || ""
        });
      });

      latestTasks.forEach((item) => {
        const pts = Number(item.points) || 0;
        totalPoints += pts;
        combined.push({
          sortTime: item.createdAt || 0,
          badge: `مهمة (+${pts} نقطة)`,
          title: item.user || "عضو",
          body: `${item.taskTitle || ""} — ${item.proof || ""}`
        });
      });

      pointsEl.textContent = String(totalPoints);
      combined.sort((a, b) => b.sortTime - a.sortTime);

      if (combined.length === 0) {
        feedEl.innerHTML = '<div class="empty-msg">لا توجد طلبات أو مهام مسجلة حتى الآن.</div>';
        return;
      }

      feedEl.innerHTML = combined
        .slice(0, 25)
        .map(
          (row) => `
          <div class="feed-item">
            <div class="feed-top">
              <strong>${escapeHtml(row.title)}</strong>
              <span class="tag">${escapeHtml(row.badge)}</span>
            </div>
            <div>${escapeHtml(row.body)}</div>
          </div>
        `
        )
        .join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    onValue(
      ref(db, "orders"),
      (snap) => {
        const val = snap.val() || {};
        latestOrders = Object.values(val);
        setStatus("متصل بقاعدة البيانات بنجاح.", true);
        renderFeed();
      },
      (err) => {
        setStatus("خطأ في قراءة قاعدة البيانات: " + err.message);
      }
    );

    onValue(ref(db, "tasks"), (snap) => {
      const val = snap.val() || {};
      latestTasks = Object.values(val);
      renderFeed();
    });
  </script>
</body>
</html>
